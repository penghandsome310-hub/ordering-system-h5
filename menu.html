<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>点餐 - 门店平板点餐系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 自定义样式 */
    :root {
      --primary: #D97706;
      --sidebar-width: 120px;
      --cart-height: 200px;
    }

    body {
      background: linear-gradient(135deg, #FFF7ED 0%, #FFEDD5 100%);
      overflow: hidden;
    }

    /* 移动端优先：底部分类导航 */
    .sidebar {
      position: fixed;
      bottom: var(--cart-height);
      left: 0;
      right: 0;
      height: 60px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      background: linear-gradient(to right, #FFF7ED, #FFEDD5);
      border-top: 2px solid #FED7AA;
      display: flex;
      align-items: center;
      padding: 0 1rem;
      gap: 0.5rem;
      z-index: 20;
    }

    /* 桌号信息移到顶部 */
    .table-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: linear-gradient(to right, #F59E0B, #EA580C);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      z-index: 30;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* 菜品区域 */
    .dishes-area {
      margin-top: 60px;
      margin-bottom: calc(var(--cart-height) + 60px);
      height: calc(100vh - var(--cart-height) - 120px);
      overflow-y: auto;
      padding: 1rem;
    }

    /* 底部购物车固定 */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--cart-height);
      background: white;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
      z-index: 40;
    }

    /* 平板及以上：恢复侧边栏布局 */
    @media (min-width: 768px) {
      :root {
        --sidebar-width: 180px;
        --cart-height: 220px;
      }

      .sidebar {
        width: var(--sidebar-width);
        height: calc(100vh - var(--cart-height));
        bottom: auto;
        top: 0;
        right: auto;
        overflow-y: auto;
        overflow-x: hidden;
        white-space: normal;
        flex-direction: column;
        align-items: stretch;
        padding: 1rem 0.75rem;
        border-top: none;
        border-right: 2px solid #FED7AA;
      }

      .table-header {
        position: static;
        height: auto;
        background: none;
        padding: 0;
        box-shadow: none;
      }

      .dishes-area {
        margin-left: var(--sidebar-width);
        margin-top: 0;
        margin-bottom: var(--cart-height);
        height: calc(100vh - var(--cart-height));
        padding: 1.5rem;
      }
    }

    /* 桌面端：更宽的侧边栏 */
    @media (min-width: 1024px) {
      :root {
        --sidebar-width: 200px;
        --cart-height: 280px;
      }
    }

    /* 菜系按钮激活状态 */
    .category-btn.active {
      background: linear-gradient(135deg, #D97706 0%, #EA580C 100%);
      color: white;
      font-weight: bold;
    }

    /* 移动端分类按钮样式 */
    .category-btn-mobile {
      flex-shrink: 0;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      background: white;
      font-size: 0.875rem;
      font-weight: 500;
      color: #4B5563;
      transition: all 0.2s;
    }

    @media (min-width: 768px) {
      .category-btn-mobile {
        width: 100%;
        padding: 1rem 0.75rem;
        border-radius: 0.75rem;
        font-size: 1rem;
      }
    }

    /* 辣度图标 */
    .spicy-icon {
      display: inline-block;
      color: #EF4444;
    }

    /* 购物车展开面板 */
    .cart-panel {
      max-height: 250px;
      overflow-y: auto;
    }

    /* 滚动条样式 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F3F4F6;
    }
    ::-webkit-scrollbar-thumb {
      background: #D97706;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <!-- 顶部桌号栏（移动端显示） -->
  <div class="table-header md:hidden">
    <div class="flex items-center gap-3">
      <button onclick="goBack()" class="text-white hover:opacity-80 text-xl">
        ← 返回
      </button>
      <div>
        <div class="text-xs opacity-90">当前桌号</div>
        <div class="text-xl font-bold" id="currentTableMobile">-</div>
      </div>
    </div>
  </div>

  <!-- 菜系导航（移动端底部/桌面端左侧） -->
  <div class="sidebar">
    <!-- 桌号信息（桌面端显示） -->
    <div class="hidden md:block p-4 bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-xl mb-3">
      <div class="text-center">
        <div class="text-sm font-medium">当前桌号</div>
        <div class="text-2xl lg:text-3xl font-bold" id="currentTable">-</div>
      </div>
      <button onclick="goBack()" class="mt-2 w-full bg-white text-amber-700 py-2 rounded-lg text-sm font-medium hover:bg-amber-50">
        ← 返回选桌
      </button>
    </div>

    <!-- 菜系列表 -->
    <div id="categoryList" class="flex md:flex-col gap-2">
      <!-- 由JavaScript生成 -->
    </div>
  </div>

  <!-- 右侧菜品区域 -->
  <div class="dishes-area" id="dishesArea">
    <div class="max-w-7xl mx-auto">
      <h2 class="text-2xl md:text-3xl font-bold text-amber-800 mb-4 md:mb-6" id="currentCategoryTitle">请选择菜系</h2>
      <!-- 手机1列、平板2列、桌面3列 -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6" id="dishesGrid">
        <!-- 菜品卡片由JavaScript生成 -->
      </div>
    </div>
  </div>

  <!-- 底部购物车 -->
  <div class="cart-bar">
    <!-- 购物车展开面板 -->
    <div class="cart-panel bg-gray-50 border-b hidden" id="cartPanel">
      <div class="p-3 md:p-4">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-lg md:text-xl font-bold text-gray-800">已选菜品</h3>
          <button onclick="toggleCartPanel()" class="text-gray-500 hover:text-gray-700">✕</button>
        </div>
        <div id="cartItemsList" class="space-y-2">
          <!-- 购物车项目列表 -->
        </div>
      </div>
    </div>

    <!-- 购物车主栏 -->
    <div class="p-3 md:p-4">
      <!-- 购物车摘要 -->
      <div class="flex items-center justify-between mb-2 md:mb-3">
        <button onclick="toggleCartPanel()" class="flex items-center gap-2 md:gap-3 hover:opacity-80">
          <div class="w-12 h-12 md:w-16 md:h-16 bg-gradient-to-br from-amber-400 to-orange-500 rounded-full flex items-center justify-center text-white text-xl md:text-2xl font-bold relative">
            🛒
            <span id="cartCount" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs md:text-sm w-5 h-5 md:w-7 md:h-7 rounded-full flex items-center justify-center">0</span>
          </div>
          <div class="text-left">
            <div class="text-xs md:text-sm text-gray-500">已选</div>
            <div class="text-base md:text-xl font-bold text-gray-800"><span id="cartItemCount">0</span> 道菜</div>
          </div>
        </button>

        <div class="text-right flex-1 mx-2">
          <div class="text-xs md:text-sm text-gray-500">合计</div>
          <div class="text-xl md:text-3xl font-bold text-amber-600">¥<span id="cartTotal">0</span></div>
        </div>

        <button onclick="submitOrder()" class="px-6 md:px-12 py-3 md:py-4 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white rounded-full text-base md:text-2xl font-bold shadow-lg hover:shadow-xl transition-all">
          提交订单
        </button>
      </div>

      <!-- 快捷操作 -->
      <div class="flex gap-2 md:gap-3">
        <button onclick="clearCart()" class="flex-1 py-2 md:py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg text-sm md:text-base font-medium">
          清空购物车
        </button>
        <button onclick="viewOrders()" class="flex-1 py-2 md:py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm md:text-base font-medium">
          查看本桌订单
        </button>
      </div>
    </div>
  </div>

  <!-- 订单确认弹窗 -->
  <div id="orderModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl md:rounded-3xl p-4 md:p-8 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
      <h2 class="text-2xl md:text-3xl font-bold text-amber-800 mb-4 md:mb-6">确认订单</h2>

      <div class="mb-4 md:mb-6">
        <div class="text-base md:text-lg text-gray-700 mb-2">桌号: <span class="font-bold text-xl md:text-2xl text-amber-600" id="modalTableNumber"></span></div>
        <div class="text-base md:text-lg text-gray-700">下单时间: <span id="modalTime"></span></div>
      </div>

      <div class="mb-4 md:mb-6">
        <h3 class="text-lg md:text-xl font-bold mb-3 text-gray-800">菜品清单</h3>
        <div id="modalDishesList" class="space-y-2 max-h-60 overflow-y-auto">
          <!-- 订单菜品列表 -->
        </div>
      </div>

      <div class="mb-4 md:mb-6">
        <label class="block text-base md:text-lg font-medium text-gray-700 mb-2">备注</label>
        <textarea id="orderNote" rows="3" placeholder="少辣、不要香菜等..." class="w-full p-3 border-2 border-gray-300 rounded-lg focus:border-amber-500 focus:outline-none text-base md:text-lg"></textarea>
      </div>

      <div class="mb-4 md:mb-6 pt-4 border-t-2">
        <div class="flex justify-between text-xl md:text-2xl font-bold">
          <span class="text-gray-800">订单总额:</span>
          <span class="text-amber-600">¥<span id="modalTotal"></span></span>
        </div>
      </div>

      <div class="flex gap-3 md:gap-4">
        <button onclick="closeOrderModal()" class="flex-1 py-3 md:py-4 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-xl text-base md:text-xl font-medium">
          取消
        </button>
        <button onclick="confirmOrder()" class="flex-1 py-3 md:py-4 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white rounded-xl text-base md:text-xl font-bold">
          确认提交
        </button>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/dishes-data.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>选择桌号 - 门店平板点餐系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 自定义配色 - 暖色餐饮风 */
    :root {
      --primary: #D97706;
      --primary-dark: #B45309;
      --bg-dark: #1F2937;
      --bg-light: #F9FAFB;
    }
    body {
      background: linear-gradient(135deg, #FEF3C7 0%, #FED7AA 100%);
      min-height: 100vh;
    }
  </style>
</head>
<body class="flex items-center justify-center p-8">
  <div class="w-full max-w-6xl">
    <!-- 标题区 -->
    <div class="text-center mb-12">
      <h1 class="text-5xl font-bold text-amber-800 mb-4">🍽️ 欢迎光临</h1>
      <p class="text-2xl text-amber-700">请选择您的桌号</p>
    </div>

    <!-- 桌号选择区 -->
    <div class="bg-white rounded-3xl shadow-2xl p-8">
      <div class="grid grid-cols-5 gap-6" id="tableGrid">
        <!-- 桌号按钮将由JavaScript生成 -->
      </div>
    </div>

    <!-- 底部功能区 -->
    <div class="mt-8 flex justify-center gap-4">
      <button onclick="goToAdmin()" class="px-8 py-4 bg-gray-600 hover:bg-gray-700 text-white rounded-full text-xl font-medium transition-all">
        商家后台
      </button>
      <button onclick="clearAllData()" class="px-8 py-4 bg-red-600 hover:bg-red-700 text-white rounded-full text-xl font-medium transition-all">
        清空所有数据
      </button>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/dishes-data.js"></script>
  <script>
    // 初始化菜品数据
    Storage.initData(DISHES_DATA);

    // 生成20个桌号按钮
    const tableGrid = document.getElementById('tableGrid');
    for (let i = 1; i <= 20; i++) {
      const button = document.createElement('button');
      button.className = 'aspect-square bg-gradient-to-br from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white rounded-2xl text-3xl font-bold shadow-lg hover:shadow-xl hover:scale-105 transition-all duration-200';
      button.textContent = `${i}号桌`;
      button.onclick = () => selectTable(i);

      // 检查该桌是否有未完成订单
      const orders = Storage.getOrdersByTable(i).filter(o => o.status !== '已结账');
      if (orders.length > 0) {
        button.classList.add('ring-4', 'ring-green-400');
        const badge = document.createElement('div');
        badge.className = 'absolute top-2 right-2 bg-red-500 text-white text-sm px-2 py-1 rounded-full';
        badge.textContent = `${orders.length}单`;
        button.style.position = 'relative';
        button.appendChild(badge);
      }

      tableGrid.appendChild(button);
    }

    // 选择桌号
    function selectTable(tableNumber) {
      Storage.setCurrentTable(tableNumber);
      Storage.clearCart(); // 清空购物车
      window.location.href = 'menu.html';
    }

    // 进入商家后台
    function goToAdmin() {
      window.location.href = 'admin.html';
    }

    // 清空所有数据（用于测试）
    function clearAllData() {
      if (confirm('确定要清空所有数据吗？此操作不可恢复！')) {
        localStorage.clear();
        alert('数据已清空，页面即将刷新');
        location.reload();
      }
    }
  </script>
</body>
</html>
